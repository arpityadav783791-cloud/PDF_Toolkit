cat > pyproject.toml <<'EOF'
[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolkit"
version = "0.1.0"
description = "A professional offline-first PDF workstation for Windows and Linux."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
pdf-toolkit = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
EOF